---
name: Bump ImageMagick version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * MON"
  pull_request:
    paths:
      - ".github/workflows/updatecli.yml"
      - ".github/scripts/**"
      - ".github/tests/**"
      - "updatecli.d/**"
      - "imagemagick-version"

permissions:
  contents: read

jobs:
  test_scripts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the advisory filter
        run: .github/tests/test-fixed-advisories.sh
      - name: Test the version bump script
        run: .github/tests/test-bump-imagemagick.sh

  updatecli:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    env:
      UPDATECLI_MODE: ${{ github.event_name == 'pull_request' && 'diff' || 'apply' }}
    steps:
      # Fork PRs get no app secrets, and a diff only needs the workflow token.
      - name: Generate app token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0

      - name: Run Updatecli in ${{ env.UPDATECLI_MODE }} mode
        run: updatecli pipeline ${{ env.UPDATECLI_MODE }}
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

  advisories:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      MARKER: "<!-- imagemagick-advisories -->"
      # Fork PR tokens are read-only.
      CAN_WRITE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the security advisories the bump fixes
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_ROWS: "150"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/imagemagick-version?ref=$GITHUB_BASE_REF" \
            -H 'Accept: application/vnd.github.raw' | tr -d '[:space:]')
          NEW=$(tr -d '[:space:]' < imagemagick-version)
          if [ "$OLD" = "$NEW" ]; then
            echo "post=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ROWS=$(gh api --paginate '/repos/ImageMagick/ImageMagick/security-advisories?per_page=100' --jq '.[]' \
            | jq -rs --arg old "$OLD" --arg new "$NEW" -f .github/scripts/fixed-advisories.jq)
          COUNT=$(printf '%s' "$ROWS" | grep -c . || true)

          {
            echo "$MARKER"
            echo "### ImageMagick $OLD -> $NEW"
            echo
            if [ "$COUNT" -gt 0 ]; then
              echo "This bump fixes $COUNT published [security advisories](https://github.com/ImageMagick/ImageMagick/security/advisories)."
              echo
              echo "| Advisory | CVE | Severity | Summary | Fixed in |"
              echo "| --- | --- | --- | --- | --- |"
              printf '%s\n' "$ROWS" | head -n "$MAX_ROWS"
              if [ "$COUNT" -gt "$MAX_ROWS" ]; then
                echo
                echo "And $((COUNT - MAX_ROWS)) more, see the link above."
              fi
            else
              echo "No published security advisory is fixed between these versions."
            fi
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$CAN_WRITE" != true ]; then
            echo "::notice::Pull request from a fork: the advisories report is in the job summary."
            exit 0
          fi
          echo "post=true" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            gh pr edit "$PR_NUMBER" --add-label security
          else
            gh pr edit "$PR_NUMBER" --remove-label security 2> /dev/null || true
          fi

      - name: Find the previous advisories comment
        id: find-comment
        if: steps.report.outputs.post == 'true'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.MARKER }}

      - name: Post or update the advisories comment
        if: steps.report.outputs.post == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: body.md
          edit-mode: replace

